name: macOS build and tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash build.sh
      - run: python3 test.py
      - run: python3 package.py
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-candidate
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
